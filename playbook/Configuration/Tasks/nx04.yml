  - !powerShell:
    command: |
      foreach ($m in (Get-ChildItem -LiteralPath . -Filter 'Nx*.ps1' -File | Sort-Object -Property Name)) { . $m.FullName }
      Invoke-NxRegistryTweak -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers' -Name 'HwSchMode' -Kind 'DWord' -Data '2' -TweakId 'NX04-001' -TweakVersion '1' -Approval 'ExplicitConsent' -Profiles 'P1','P2','P3','P4','P5','P6','P7','P9' -JournalRoot (Join-Path $env:ProgramData 'NEXTRIX\Journal') -Approved
    exeDir: true
    wait: true
    runas: currentUserElevated
    errorAction: Notify
    option: 'nx04-001'
    weight: 2

