  # 'NX10-001 CPU temperature & throttling detection report'
  - !powerShell:
    command: |
      foreach ($m in (Get-ChildItem -LiteralPath . -Filter 'Nx*.ps1' -File | Sort-Object -Property Name)) { . $m.FullName }
      Get-NxCpuThermalReport
    exeDir: true
    wait: true
    runas: currentUserElevated
    errorAction: Notify
    option: 'b-security'
    weight: 2

