# NEXTRIX category task file. GENERATED FILE, do not edit by hand.
# Source: registry/NX03.json (CPU & Processor Configuration). Playbook version 0.9.0.
# Every action is option-gated (option name = lowercase tweak id): unselected
# tweaks never run. presetExcluded tweaks are default-UNCHECKED (mechanical).
---
title: 'NEXTRIX NX03 - CPU & Processor Configuration'
description: >
  Generated from registry/NX03.json: 13 selectable tweak option(s)
  (option names are curated UI group ids). Function actions run the journaled
  NxCore engine; registry actions run the journaled Invoke-NxRegistryTweak
  pipeline (capture -> journal -> apply -> verify), never a raw engine write.
actions:
  - !status: {status: 'NX03 CPU & Processor Configuration: applying selected tweaks'}

  # 'NX03-006 CPU power throttling policy'
  - !powerShell:
    command: |
      foreach ($m in (Get-ChildItem -LiteralPath . -Filter 'Nx*.ps1' -File | Sort-Object -Property Name)) { . $m.FullName }
      Set-NxPowerThrottlingPolicy -Mode 'Disabled' -JournalRoot (Join-Path $env:ProgramData 'NEXTRIX\Journal') -Approved -Approval 'Selection'
    exeDir: true
    wait: true
    runas: currentUserElevated
    errorAction: Notify
    option: 'b-gaming'
    weight: 2

  # 'NX03-013 CPU inventory & frequency report'
  - !powerShell:
    command: |
      foreach ($m in (Get-ChildItem -LiteralPath . -Filter 'Nx*.ps1' -File | Sort-Object -Property Name)) { . $m.FullName }
      Get-NxCpuInventoryReport
    exeDir: true
    wait: true
    runas: currentUserElevated
    errorAction: Notify
    option: 'b-gaming'
    weight: 2
