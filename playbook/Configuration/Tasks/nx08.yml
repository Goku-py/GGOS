# NEXTRIX category task file. GENERATED FILE, do not edit by hand.
# Source: registry/NX08.json (Input & Peripherals). Playbook version 0.9.1.
# Every action is option-gated (option name = lowercase tweak id): unselected
# tweaks never run. presetExcluded tweaks are default-UNCHECKED (mechanical).
---
title: 'NEXTRIX NX08 - Input & Peripherals'
description: >
  Generated from registry/NX08.json: 8 selectable tweak option(s)
  (option names are curated UI group ids). Function actions run the journaled
  NxCore engine; registry actions run the journaled Invoke-NxRegistryTweak
  pipeline (capture -> journal -> apply -> verify), never a raw engine write.
actions:
  - !status: {status: 'NX08 Input & Peripherals: applying selected tweaks'}

  # 'NX08-001 Disable Enhance Pointer Precision'
  - !powerShell:
    command: |
      foreach ($m in (Get-ChildItem -LiteralPath . -Filter 'Nx*.ps1' -File | Sort-Object -Property Name)) { . $m.FullName }
      Set-NxMouseAcceleration -MouseSpeed 0 -MouseThreshold1 0 -MouseThreshold2 0 -JournalRoot (Join-Path $env:ProgramData 'NEXTRIX\Journal') -Approved -Approval 'Selection'
    exeDir: true
    wait: true
    runas: currentUserElevated
    errorAction: Notify
    option: 'b-input'
    weight: 2

  # 'NX08-002 Mouse pointer speed/sensitivity'
