# NEXTRIX category task file. GENERATED FILE, do not edit by hand.
# Source: registry/NX07.json (Network Optimization). Playbook version 0.8.0.
# Every action is option-gated (option name = lowercase tweak id): unselected
# tweaks never run. presetExcluded tweaks are default-UNCHECKED (mechanical).
---
title: 'NEXTRIX NX07 - Network Optimization'
description: >
  Generated from registry/NX07.json: 22 selectable tweak option(s)
  (option names are curated UI group ids). Function actions run the journaled
  NxCore engine; registry actions run the journaled Invoke-NxRegistryTweak
  pipeline (capture -> journal -> apply -> verify), never a raw engine write.
actions:
  - !status: {status: 'NX07 Network Optimization: applying selected tweaks'}

  # 'NX07-001 Adapter inventory & capability report'
  - !status: {status: 'NX07-001 Adapter inventory & capability report', option: 'g-netdiag'}
  - !powerShell:
    command: |
      foreach ($m in (Get-ChildItem -LiteralPath . -Filter 'Nx*.ps1' -File | Sort-Object -Property Name)) { . $m.FullName }
      Get-Nx07AdapterInventory
    exeDir: true
    wait: true
    runas: currentUserElevated
    errorAction: Notify
    option: 'g-netdiag'
    weight: 2

  # 'NX07-002 Adapter power management'
  - !status: {status: 'NX07-002 Adapter power management', option: 'g-eth'}
  - !powerShell:
    command: |
      foreach ($m in (Get-ChildItem -LiteralPath . -Filter 'Nx*.ps1' -File | Sort-Object -Property Name)) { . $m.FullName }
      Set-Nx07AdapterPowerManagement -SelectiveSuspend 'Disabled' -DeviceSleepOnDisconnect 'Disabled' -D0PacketCoalescing 'Disabled' -WakeOnPattern 'Disabled' -WakeOnMagicPacket 'Disabled' -JournalRoot (Join-Path $env:ProgramData 'NEXTRIX\Journal') -Approved -Approval 'SelectionPlusConfirmation'
    exeDir: true
    wait: true
    runas: currentUserElevated
    errorAction: Notify
    option: 'g-eth'
    weight: 2

  # 'NX07-012 Wi-Fi roaming aggressiveness'
  - !status: {status: 'NX07-012 Wi-Fi roaming aggressiveness', option: 'g-wifi'}
  - !powerShell:
    command: |
      foreach ($m in (Get-ChildItem -LiteralPath . -Filter 'Nx*.ps1' -File | Sort-Object -Property Name)) { . $m.FullName }
      Set-Nx07WifiRoamingAggressiveness -Aggressiveness 'Lowest' -JournalRoot (Join-Path $env:ProgramData 'NEXTRIX\Journal') -Approved -Approval 'Selection'
    exeDir: true
    wait: true
    runas: currentUserElevated
    errorAction: Notify
    option: 'g-wifi'
    weight: 2

  # 'NX07-013 Wi-Fi preferred band'
  - !status: {status: 'NX07-013 Wi-Fi preferred band', option: 'g-wifi'}
  - !powerShell:
    command: |
      foreach ($m in (Get-ChildItem -LiteralPath . -Filter 'Nx*.ps1' -File | Sort-Object -Property Name)) { . $m.FullName }
      Set-Nx07WifiPreferredBand -Band 'Prefer5GHz' -JournalRoot (Join-Path $env:ProgramData 'NEXTRIX\Journal') -Approved -Approval 'Selection'
    exeDir: true
    wait: true
    runas: currentUserElevated
    errorAction: Notify
    option: 'g-wifi'
    weight: 2

  # 'NX07-015 Wi-Fi transmit power'
  - !status: {status: 'NX07-015 Wi-Fi transmit power', option: 'g-wifi'}
  - !powerShell:
    command: |
      foreach ($m in (Get-ChildItem -LiteralPath . -Filter 'Nx*.ps1' -File | Sort-Object -Property Name)) { . $m.FullName }
      Set-Nx07WifiTransmitPower -Strength 'Highest' -JournalRoot (Join-Path $env:ProgramData 'NEXTRIX\Journal') -Approved -Approval 'Selection'
    exeDir: true
    wait: true
    runas: currentUserElevated
    errorAction: Notify
    option: 'g-wifi'
    weight: 2

  # 'NX07-016 DNS configuration'
  - !status: {status: 'NX07-016 DNS configuration', option: 'g-wifi'}
  - !powerShell:
    command: |
      foreach ($m in (Get-ChildItem -LiteralPath . -Filter 'Nx*.ps1' -File | Sort-Object -Property Name)) { . $m.FullName }
      Set-Nx07DnsConfiguration -ServerAddresses '1.1.1.1,1.0.0.1' -Ipv6ServerAddresses '2606:4700:4700::1111,2606:4700:4700::1001' -ProbeName 'dns.msftncsi.com' -JournalRoot (Join-Path $env:ProgramData 'NEXTRIX\Journal') -Approved -Approval 'SelectionPlusConfirmation'
    exeDir: true
    wait: true
    runas: currentUserElevated
    errorAction: Notify
    option: 'g-wifi'
    weight: 2

  # 'NX07-019 Network diagnostics report'
  - !status: {status: 'NX07-019 Network diagnostics report', option: 'g-netdiag'}
  - !powerShell:
    command: |
      foreach ($m in (Get-ChildItem -LiteralPath . -Filter 'Nx*.ps1' -File | Sort-Object -Property Name)) { . $m.FullName }
      Get-Nx07NetworkDiagnosticReport -PathPingTarget '' -JournalRoot (Join-Path $env:ProgramData 'NEXTRIX\Journal') -Approval 'Selection'
    exeDir: true
    wait: true
    runas: currentUserElevated
    errorAction: Notify
    option: 'g-netdiag'
    weight: 2
