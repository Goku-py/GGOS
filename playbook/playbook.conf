    <Description><![CDATA[
NEXTRIX applies only the tweaks you select. Nothing runs automatically beyond the mandatory
pre-flight capture (journal initialization, hardware and build reports, a System Restore point
and targeted backups).

This build carries the following categories from the NEXTRIX tweak registry:
NX16 Maintenance & Recovery (17 tweaks); NX01 Windows Foundation (16 tweaks); NX02 Gaming & Esports (12 tweaks); NX04 GPU & Graphics (23 tweaks); NX09 Power Management (15 tweaks).

Every applied change is journaled by the bundled NxCore engine, and rollback (one tweak, one
category, one profile, or everything) is provided by NEXTRIX itself: the playbook platform has
no uninstall. Windows Update and security features stay on by default.

No performance claims are made. Validate every change on your own hardware.]]>
    </Description>
