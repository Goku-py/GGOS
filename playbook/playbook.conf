    <ShortDescription>Selective, journaled Windows 11 configuration with NEXTRIX-owned rollback.</ShortDescription>
    <Description><![CDATA[
NEXTRIX applies only what you select. A short pre-flight (journal, hardware and build
reports, restore point, targeted backups) runs first, then the selected bundles are applied.

Every change is journaled by the bundled NxCore engine and can be rolled back per tweak,
category, profile or entirely. Windows Update and security features stay on by default.
No performance claims are made - validate on your own hardware.]]>
