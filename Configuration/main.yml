  - !task: {path: 'Tasks/gaming.yml'}
  - !writeStatus: {status: 'Enabling the Ultimate Performance plan'}
  - !task: {path: 'Tasks/power-plans.yml'}
  # v0.6.0 ordering: hardware tuning follows the power-plan tasks so its AC
  # values (EPP, ASPM, NVMe idle) land on the plan that stays active. The
  # plan-changing tasks are ungated now, so a desktop ends the run on Ultimate
  # Performance; applying the values first would leave them on the old scheme
  # and verify.ps1 would read the new one.
  - !writeStatus: {status: 'Applying hardware tuning'}
  - !task: {path: 'Tasks/hardware-tuning.yml'}
  - !writeStatus: {status: 'Running disk cleanup', option: 'cleanup'}
  - !task: {path: 'Tasks/cleanup.yml'}
  - !writeStatus: {status: 'Running aggressive cleanup', option: 'cleanup-aggressive'}
  - !task: {path: 'Tasks/cleanup-aggressive.yml'}
  - !writeStatus: {status: 'Cleaning GPU shader caches'}
