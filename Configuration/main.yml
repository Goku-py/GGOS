  - !writeStatus: {status: 'Updating applications', option: 'winget-update'}
  - !task: {path: 'Tasks/winget.yml'}
  - !writeStatus: {status: 'Applying the GGOS wallpaper', option: 'ggos-theme'}
  - !task: {path: 'Tasks/theming.yml'}
  - !writeStatus: {status: 'Installing selected apps', option: 'app-firefox'}
  - !task: {path: 'Tasks/apps.yml'}
  - !writeStatus: {status: 'Applying network tuning'}
  - !task: {path: 'Tasks/network.yml'}
  - !writeStatus: {status: 'Reporting security posture'}
