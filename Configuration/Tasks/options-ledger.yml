title: Option ledger
# privilege: Admin — INERT (engine ignores task-level privilege; v0.4.0 audit).
# Spec B3: records what the run applies into %SystemRoot%\GGOS\ggos-options.txt.
# The first action is ungated and clears the ledger; every other action appends
# its line. Tasks/verify.yml cross-checks this ledger at the end of the run.
#
# v0.6.0: the wizard only shows optional extras. The core tuning options were
# removed from playbook.conf and their actions are now ungated in main.yml, so
# they are recorded here as a fixed block (one line per area) instead of one
# gated action each. Options that still exist in the wizard stay gated: they
# are only recorded when the user selects them. Keep the fixed block in sync
# with the ungated tasks in Configuration/main.yml - every name below has a
# marker map in Executables/verify.ps1.
actions:
  # ---- Ledger initialisation (always runs) ----
  - !powerShell:
    exeDir: false
    wait: true
    errorAction: Notify
    timeout: 120
    command: |-
      New-Item -ItemType Directory -Path $env:SystemRoot\GGOS -Force | Out-Null
      New-Item -ItemType File -Path $env:SystemRoot\GGOS\ggos-options.txt -Force | Out-Null
      Clear-Content -Path $env:SystemRoot\GGOS\ggos-options.txt
      Write-Output 'GGOS: option ledger initialised'

  # ---- Areas applied unconditionally in this version (no wizard option) ----
  - !powerShell:
    exeDir: false
    wait: true
    errorAction: Notify
    timeout: 120
    command: |-
      $areas = @(
          'system-optimization', 'services', 'telemetry', 'ads-ui', 'verbose-logon',
          'f8-boot', 'pagefile', 'bloat-copilot', 'bloat-bing', 'bloat-widgets',
          'gaming', 'shader-cache', 'epp-perf', 'desktop-device-power',
          'nvme-latency', 'laptop-power', 'wifi-tuning',
          'input-accel', 'input-queue', 'wireless-input', 'network-latency',
          'network-bufferbloat', 'network-nic', 'network-ultra', 'recall-disable',
          'power-ultimate', 'security-posture'
      )
      foreach ($area in $areas) { Add-Content -Path $env:SystemRoot\GGOS\ggos-options.txt -Value $area }
      Write-Output ('GGOS: option ledger recorded {0} unconditional area(s)' -f $areas.Count)

  # ---- One gated append per option the wizard still offers ----
  - !powerShell:
    exeDir: false
    wait: true
    errorAction: Notify
    option: 'per-user'
    timeout: 120
    command: |-
      Add-Content -Path $env:SystemRoot\GGOS\ggos-options.txt -Value 'per-user'

  # Office telemetry hardening lives inside the per-user hive sweep, so it is
  # only meaningful when the all-accounts option is selected.
  - !powerShell:
    exeDir: false
    wait: true
    errorAction: Notify
    option: 'per-user'
    timeout: 120
    command: |-
      Add-Content -Path $env:SystemRoot\GGOS\ggos-options.txt -Value 'office-telemetry'

  - !powerShell:
    exeDir: false
    wait: true
    errorAction: Notify
    option: 'bloat-extra'
    timeout: 120
    command: |-
      Add-Content -Path $env:SystemRoot\GGOS\ggos-options.txt -Value 'bloat-extra'

  - !powerShell:
