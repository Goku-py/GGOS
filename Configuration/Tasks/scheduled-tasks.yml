title: Scheduled tasks
# privilege: Admin — disabling entries in the machine Task Scheduler store requires
# elevation (docs do not define a task-level `privilege` param; declaration is per
# GGOS spec B6 and may be informational in current Wizard builds).
# Wasteful scheduled tasks disabled (never deleted, so they can be re-enabled manually).
# Ported from TBOK's active DisableTask list.
actions:
  # ---- Office telemetry agents (only when telemetry AND office-telemetry are
  #      both selected). v0.4.0: options: lists are OR in the engine (source-
  #      verified IsApplicableOption); 'a&b' is the documented-in-source AND
  #      conjunction. The old array disabled these tasks when EITHER option
  #      was ticked - broader than intended.
  - !scheduledTask: {path: '\Microsoft\Office\OfficeTelemetryAgent', operation: disable, errorAction: Log, option: 'telemetry&office-telemetry'}
  - !scheduledTask: {path: '\Microsoft\Office\OfficeTelemetryAgentFallBack', operation: disable, errorAction: Log, option: 'telemetry&office-telemetry'}
  - !scheduledTask: {path: '\Microsoft\Office\OfficeTelemetryAgentLogon', operation: disable, errorAction: Log, option: 'telemetry&office-telemetry'}
  - !scheduledTask: {path: '\Microsoft\Office\OfficeTelemetryAgentFallBack2016', operation: disable, errorAction: Log, option: 'telemetry&office-telemetry'}
  - !scheduledTask: {path: '\Microsoft\Office\OfficeTelemetryAgentLogOn2016', operation: disable, errorAction: Log, option: 'telemetry&office-telemetry'}

  # ---- Telemetry / CEIP tasks ----
  - !scheduledTask: {path: '\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser', operation: disable, errorAction: Log, option: 'telemetry'}
  - !scheduledTask: {path: '\Microsoft\Windows\Autochk\Proxy', operation: disable, errorAction: Log, option: 'telemetry'}
  - !scheduledTask: {path: '\Microsoft\Windows\Customer Experience Improvement Program\Consolidator', operation: disable, errorAction: Log, option: 'telemetry'}
  - !scheduledTask: {path: '\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip', operation: disable, errorAction: Log, option: 'telemetry'}
  - !scheduledTask: {path: '\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticDataCollector', operation: disable, errorAction: Log, option: 'telemetry'}
  - !scheduledTask: {path: '\Microsoft\Windows\Feedback\Siuf\DmClient', operation: disable, errorAction: Log, option: 'telemetry'}
  - !scheduledTask: {path: '\Microsoft\Windows\Feedback\Siuf\DmClientOnScenarioDownload', operation: disable, errorAction: Log, option: 'telemetry'}
  - !scheduledTask: {path: '\Microsoft\Windows\Windows Error Reporting\QueueReporting', operation: disable, errorAction: Log, option: 'telemetry'}

  # ---- Maps download task (bandwidth, not privacy) ----
  # TBOK notes this runs hourly even when Maps is never used.
  - !scheduledTask: {path: '\Microsoft\Windows\Maps\MapsUpdateTask', operation: disable, errorAction: Log, option: 'system-optimization'}
