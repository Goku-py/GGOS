title: Services
# Service startup tuning - SAFE subset ported from TBOK's resolved service plan.
# Everything here is set to Manual (demand) or Disabled; no service is deleted or
# stopped from this file. Startup types are written with the !service action.
#
# Deliberately NOT touched (matches TBOK and GGOS safety rules):
#   WinDefend, WdNisSvc, WdNisDrv, SecurityHealthService, wscsvc (antivirus/security)
#   wuauserv, UsoSvc, BITS (Windows Update)
#   AppIDSvc, Wecsvc (security-relevant collection)
#   ssh-agent (developer SSH workflows)
#   VSS, swprv (System Restore support)
#   WSearch, SysMain (handled elsewhere: WSearch untouched, SysMain via memory policy)
#   All TBOK "auto"/"delayed-auto" restoration entries (defaults; no effect for most users)
actions:
  # ---- Services disabled outright ----
  # Deprecated/unused virtualization, port-sharing and UEV agents. DiagTrack is
  # disabled in telemetry.yml under the telemetry option instead.
