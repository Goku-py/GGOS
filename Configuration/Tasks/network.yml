title: Network latency tuning
privilege: Admin
# C7 (opt-in, default OFF): per-interface TCP latency tuning, XOS semantics
# re-expressed (no upstream code copied). Sets TcpAckFrequency=1, TCPNoDelay=1 and
# TcpDelAckTicks=0 (DWORD) on wired/physical interfaces only. WiFi (native 802.11,
# *PhysicalMediaType 0x09/0x0A) and virtual/VPN/Bluetooth adapters are excluded by
# design. Prior values (or an ABSENT marker) are recorded under
# HKLM\SOFTWARE\GGOS\NetworkUndo\<interface-guid> for manual restore.
#
# Default OFF because the benefit is game/protocol dependent (some servers and
# applications behave worse with Nagle disabled).
# NOTE: wired into main.yml by the orchestration owner; actions here are
# self-gated via the 'network-latency' option.
actions:
  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Notify
    option: 'network-latency'
    timeout: 120
    command: '.\network-latency.ps1'
  # Bufferbloat relief: TCP pacing + ECN + auto-tuning Normal (research-backed;
  # the full fix is router-side SQM - noted in README and script comments).
  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Notify
    option: 'network-bufferbloat'
    timeout: 120
    command: '.\network-tuning.ps1 -Mode bufferbloat'
  # NIC low-latency without speed cost: EEE/Green Ethernet/Power Saving + Flow Control off.
  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Notify
    option: 'network-nic'
    timeout: 180
    command: '.\network-tuning.ps1 -Mode nic'
  # Ultra mode: Interrupt Moderation + RSC + UDP RSC (URO, 24H2+) off - lowest latency,
  # slightly higher CPU under load. Separate opt-in so speeds stay maintained by default.
  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Notify
    option: 'network-ultra'
    timeout: 180
    command: '.\network-tuning.ps1 -Mode ultra'
