title: Network latency tuning
# privilege: Admin — INERT (engine ignores task-level privilege; v0.4.0 audit).
# C7 (v0.6.0: applied automatically - no wizard option): per-interface TCP
# latency tuning, XOS semantics re-expressed (no upstream code copied). Sets
# TcpAckFrequency=1, TCPNoDelay=1 and TcpDelAckTicks=0 (DWORD) on wired/physical
# interfaces only. WiFi (native 802.11, *PhysicalMediaType 0x09/0x0A) and
# virtual/VPN/Bluetooth adapters are excluded by design. Prior values (or an
# ABSENT marker) are recorded under
# HKLM\SOFTWARE\GGOS\NetworkUndo\<interface-guid> for manual restore.
#
# v0.5.0 shipped this default-OFF because the benefit is game/protocol dependent
# (some servers and applications behave worse with Nagle disabled). v0.6.0 makes
# it part of the automatic tuning: the wizard shows no checkbox for it, and
# verify.ps1 reports NOTE (not DRIFT) on a machine with no wired adapter.
# NOTE: wired into main.yml by the orchestration owner; every action here is
# ungated in v0.6.0.
#
# V03 Wi-Fi addition (wifi-tuning.ps1): Wi-Fi-ONLY driver settings - MIMO Power
# Save -> No SMPS, U-APSD off, roaming aggressiveness lowest (sticky-client
# trade-off on multi-AP homes), adapter power management off, and per-WLAN
# profile powerManagement=disabled where the netsh build accepts it. Uses the
# inverse of the wired filter above; originals are recorded under
# HKLM\SOFTWARE\GGOS\NetworkUndo\WifiUndo\<adapter> for a future revert task.
actions:
  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Notify
    timeout: 120
    command: '.\network-latency.ps1'
  # Bufferbloat relief: TCP pacing + ECN + auto-tuning Normal (research-backed;
  # the full fix is router-side SQM - noted in README and script comments).
  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Notify
    timeout: 120
    command: '.\network-tuning.ps1 -Mode bufferbloat'
  # NIC low-latency without speed cost: EEE/Green Ethernet/Power Saving + Flow Control off.
  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Notify
    timeout: 180
    command: '.\network-tuning.ps1 -Mode nic'
  # Ultra mode: Interrupt Moderation + RSC + UDP RSC (URO, 24H2+) off - lowest latency,
  # slightly higher CPU under load. Separate opt-in so speeds stay maintained by default.
  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Notify
    timeout: 180
    command: '.\network-tuning.ps1 -Mode ultra'
  # Wi-Fi latency (V03): driver power-save off - MIMO 'No SMPS', U-APSD off,
  # roaming aggressiveness lowest (sticky-client trade-off on multi-AP homes),
  # device power management off, per-profile powerManagement=disabled (runtime-
  # verified). Wi-Fi adapters only; originals recorded under WifiUndo\<adapter>.
  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Notify
    timeout: 180
    command: '.\wifi-tuning.ps1'
