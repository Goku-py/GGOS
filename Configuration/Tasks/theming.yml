title: Theming
# privilege: Admin — INERT (engine ignores task-level privilege; v0.4.0 audit);
# elevation comes from the !powerShell default runas. The hive sweeps, the
# %SystemRoot%\GGOS\Assets copy and the HKLM\SOFTWARE\GGOS stamp require it.
# Applies the shipped GGOS wallpaper (option ggos-theme):
#   1. copies Executables\Assets\ggos-wallpaper.jpg to
#      %SystemRoot%\GGOS\Assets\ggos-wallpaper.jpg (creates the directory),
#   2. writes HKCU\Control Panel\Desktop WallPaper for every loaded
#      interactive hive, HKU\.DEFAULT and the Default profile template via
#      the shared per-user engine (per-hive reg.exe export backups included
#      — the exact per-user.ps1 sweep pattern),
#   3. applies it live for the wizard's session via
#      SystemParametersInfo(SPI_SETDESKWALLPAPER) (Add-Type P/Invoke;
#      Microsoft Learn, SystemParametersInfo function).
# If the shipped asset is missing, the task logs to skipped.txt and exits 0
# (the asset is generated by a separate track; the path is wired regardless).
# Revert note: the previous wallpaper value is NOT recorded — this option is
# documented as not revertable in revert.yml.
actions:
  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Notify
    option: 'ggos-theme'
    timeout: 300
    command: '.\theming.ps1'
