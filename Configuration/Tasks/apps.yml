title: App installs
# privilege: NOT declared for the actions — every install runs AS THE CURRENT
# elevated user (runas: currentUserElevated), the same technique as
# winget.yml: winget is a per-user app execution alias that is not resolvable
# for SYSTEM/trustedInstaller, and user apps must land in the user's context.
#
# Each action installs exactly ONE pinned app by winget ID. These options
# INSTALL software (nothing is removed here — see the page's BottomLine).
# IDs verified against the live winget source (2026-11-19):
#   Mozilla.Firefox  Brave.Brave  7zip.7zip  Microsoft.PowerToys
#   Valve.Steam     Discord.Discord  VideoLAN.VLC
# Flags: --id <ID> --exact (exact ID match; winget has no --exact-id flag),
# --silent --accept-package-agreements --accept-source-agreements.
# A missing winget is a graceful skip (skipped.txt + exit 0), never a run
# failure; a nonzero winget exit (already installed, download failure) is
# reported and the run continues.
actions:
  # ---- Firefox (Mozilla.Firefox) ----
  - !powerShell:
    runas: currentUserElevated
    wait: true
    errorAction: Notify
    option: 'app-firefox'
    timeout: 1800
    command: |-
      $wingetExe = $null
      $cmd = Get-Command winget.exe -ErrorAction SilentlyContinue
      if ($cmd) {
          $wingetExe = $cmd.Source
      } elseif (Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\winget.exe')) {
          $wingetExe = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\winget.exe'
      }
      if (-not $wingetExe) {
          $ggDir = Join-Path $env:SystemRoot 'GGOS'
          New-Item -ItemType Directory -Path $ggDir -Force | Out-Null
          Add-Content -Path (Join-Path $ggDir 'skipped.txt') -Value ('{0} SKIPPED(winget missing): app-firefox (Mozilla.Firefox)' -f (Get-Date -Format s))
          Write-Output 'GGOS apps: winget was not found - Firefox was not installed.'
          exit 0
      }
      Write-Output "GGOS apps: installing Mozilla.Firefox with $wingetExe"
      & $wingetExe install --id Mozilla.Firefox --exact --silent --accept-package-agreements --accept-source-agreements
      $code = $LASTEXITCODE
      if ($code -ne 0) {
          Write-Output "GGOS apps: winget exited with code $code (Firefox may already be installed or the install failed)."
      } else {
          Write-Output 'GGOS apps: Firefox install completed.'
      }
      exit 0

