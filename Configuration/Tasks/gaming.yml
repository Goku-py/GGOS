title: Gaming
privilege: Admin
# Gaming-focused registry values plus chassis-aware power configuration.
# Registry values below are machine-wide; the chassis-aware logic (power plan,
# processor boost mode, power throttling, bcdedit) lives in gaming-power.ps1.
#
# Portions derived from ChrisTitusTech/winutil (MIT License, (c) 2022 CT Tech Group LLC)
# where noted.
actions:
  # ---- Hardware-accelerated GPU scheduling ----
  # Requests HAGS where the installed GPU and driver support it.
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers', value: 'HWSchMode', type: REG_DWORD, data: 2, option: 'gaming'}

  # ---- Windowed game optimizations (Win11 24H2+ direct composition) ----
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\GameDVR\Graphics', value: 'OptimizationsForWindowedGames', type: REG_DWORD, data: 1, option: 'gaming'}

  # ---- Multimedia Class Scheduler tuning ----
  # System responsiveness for background vs. multimedia (10 keeps a small
  # background slice; 0 is clamped up to 20 by Windows).
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile', value: 'SystemResponsiveness', type: REG_DWORD, data: 10, option: 'gaming'}
  # Games thread scheduling: priority 6 with Medium scheduling category.
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', value: 'SystemResponsiveness', type: REG_DWORD, data: 10, option: 'gaming'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', value: 'Priority', type: REG_DWORD, data: 6, option: 'gaming'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', value: 'Scheduling Category', type: REG_SZ, data: 'Medium', option: 'gaming'}
  # Latency Sensitive defaults to True upstream; written to make the state explicit.
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games', value: 'Latency Sensitive', type: REG_SZ, data: 'True', option: 'gaming'}
  # Audio thread scheduling mirrors the Games task.
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Audio', value: 'Priority', type: REG_DWORD, data: 6, option: 'gaming'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Audio', value: 'Scheduling Category', type: REG_SZ, data: 'Medium', option: 'gaming'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Audio', value: 'Latency Sensitive', type: REG_SZ, data: 'True', option: 'gaming'}

  # ---- Edge gaming mode (lowers Edge CPU usage while gaming) ----
  - !registryValue: {path: 'HKLM\Software\Policies\Microsoft\Edge', value: 'GamerModeEnabled', type: REG_DWORD, data: 1, option: 'gaming'}

  # ---- 24H2 system-wide timer resolution semantics ----
  # Windows 11 24H2 stopped applying user-process timer requests system-wide;
  # these kernel values restore the global behavior. Harmless on earlier builds.
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\kernel', value: 'GlobalTimerResolutionRequests', type: REG_DWORD, data: 1, option: 'gaming', builds: ['>=22621']}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\kernel', value: 'SerializeTimerExpiration', type: REG_DWORD, data: 1, option: 'gaming', builds: ['>=22621']}

  # ---- GPU driver hang tolerance ----
  # Raises the timeout before Windows resets a 'hung' GPU driver; prevents false
  # resets during long shader compilations.
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers', value: 'TdrDelay', type: REG_DWORD, data: 10, option: 'gaming'}

  # ---- MPO recall (re-expressed from community findings) ----
  # Legacy overlay-disable values are removed rather than set: forcing MPO off
  # broke overlays and frame generation on modern drivers, so stale overrides
  # from other tweak tools are cleaned instead of created.
  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Notify
    option: 'gaming'
    timeout: 60
    command: |
      $dwmPath = 'HKLM:\SOFTWARE\Microsoft\Windows\Dwm'
      foreach ($name in @('OverlayTestMode', 'DisableOverlays')) {
        $present = Get-ItemProperty -Path $dwmPath -Name $name -ErrorAction SilentlyContinue
        if ($present) {
          Remove-ItemProperty -Path $dwmPath -Name $name -Force
          Write-Output ('GGOS: removed legacy MPO override ' + $name)
        }
      }
      exit 0

  # ---- Timer-resolution helper task ----
  # GGOSSetTimerResolution.exe pins the system timer at 0.5 ms by holding a
  # native resolution request from a resident process (24H2-safe). Registered as
  # a hidden boot task as SYSTEM with restart-on-failure, then started
  # immediately so the resolution applies without a reboot.
  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Notify
    option: 'gaming'
    timeout: 120
    command: |
      $timerExe = Join-Path (Get-Location) 'GGOSSetTimerResolution.exe'
      if (-not (Test-Path $timerExe)) {
        Write-Output 'GGOS: timer helper executable not found - task creation skipped.'
        exit 0
      }
      $action = New-ScheduledTaskAction -Execute $timerExe -Argument '--resolution 5000'
      $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
      $trigger = New-ScheduledTaskTrigger -AtStartup
      $settings = New-ScheduledTaskSettingsSet -RestartCount 999 -RestartInterval (New-TimeSpan -Minutes 1) -ExecutionTimeLimit ([TimeSpan]::Zero) -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
      Register-ScheduledTask -TaskName 'GGOS-TimerResolution' -Action $action -Principal $principal -Trigger $trigger -Settings $settings -Force | Out-Null
      Start-ScheduledTask -TaskName 'GGOS-TimerResolution'
      Write-Output 'GGOS: timer-resolution task registered and started.'
      exit 0

  # ---- Chassis-aware power configuration ----
  # - Removes a bcdedit useplatformclock override (reset HPET dependency detection)
  # - Desktop: disables power throttling lazy mode, imports the fixed-GUID "GGOS
  #   Performance" plan (previous plan recorded for restore), sets processor boost
  #   mode "Aggressive", sets Win32PrioritySeparation to the documented default
  # - Laptop: keeps the current power plan (battery management preserved), sets
  #   boost mode "Efficient Aggressive"
  - !powerShell:
    exeDir: true
    wait: true
    errorAction: Notify
    option: 'gaming'
    timeout: 600
    command: '.\gaming-power.ps1'
