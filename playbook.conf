<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>GGOS</Name>
    <Username>Goku</Username>
    <ShortDescription>Interactive Windows optimization, debloat and cleanup playbook</ShortDescription>
    <Title>GGOS - Windows Performance Playbook</Title>
    <Description>GGOS makes Windows faster, cleaner and more private. You choose exactly what to apply from the list on the next screens - every checkbox explains itself, and hardware is detected so desktops and laptops each get settings that fit them. Before anything changes, GGOS creates a System Restore point and backs up the registry, so everything can be undone. Nothing here disables Windows security, Windows Update, or your antivirus. Tick the defaults, or adjust freely - each item is independent.</Description>
    <Details>GGOS performance playbook. Registry, services, scheduled tasks, APPX, power and cleanup optimizations with interactive feature selection, rollback protection and hardware-aware policies.</Details>
    <Version>0.3.1</Version>
    <UniqueId>7c1f2b3e-5d84-4a91-b2c6-0e9f8a7d4c31</UniqueId>
    <Requirements>
        <Requirement>NoPendingUpdates</Requirement>
        <Requirement>PluggedIn</Requirement>
    </Requirements>
    <FeaturePages>
        <RadioPage Description="Which PC is this? Auto-detect works for most machines.">
            <Options>
                <RadioOption DefaultOption="true">
                    <Text>Auto-detect (recommended)</Text>
                    <Name>pc-auto</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Desktop</Text>
                    <Name>pc-desktop</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Laptop</Text>
                    <Name>pc-laptop</Name>
                </RadioOption>
            </Options>
        </RadioPage>
        <CheckboxPage Description="Recommended defaults. Restore point first.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Core system tweaks</Text>
                    <Name>system-optimization</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Service tuning</Text>
                    <Name>services</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Telemetry hardening</Text>
                    <Name>telemetry</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove ads and clutter</Text>
                    <Name>ads-ui</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage DependsOn="system-optimization" Description="User profiles and optional system changes.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Apply to all user profiles</Text>
                    <Name>per-user</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Detailed logon messages</Text>
                    <Name>verbose-logon</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Restore F8 boot menu</Text>
                    <Name>f8-boot</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Auto-tune page file</Text>
                    <Name>pagefile</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage Description="Select the bloat to remove.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Copilot</Text>
                    <Name>bloat-copilot</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Bing Search</Text>
                    <Name>bloat-bing</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Widgets</Text>
                    <Name>bloat-widgets</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Remove OEM trial apps</Text>
                    <Name>bloat-oem</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage Description="Office privacy and gaming mode.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Disable Office telemetry</Text>
                    <Name>office-telemetry</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Gaming mode</Text>
                    <Name>gaming</Name>
                </CheckboxOption>
            </Options>
            <BottomLine Text="Auto-detects desktop or laptop."/>
        </CheckboxPage>
        <CheckboxPage Description="Disk cleanup and app updates.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Safe disk cleanup</Text>
                    <Name>cleanup</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Deep cleanup (cannot be undone)</Text>
                    <Name>cleanup-aggressive</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Update all apps</Text>
                    <Name>winget-update</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage DependsOn="pc-desktop" Description="Desktop-only power settings.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>CPU max performance (EPP)</Text>
                    <Name>epp-perf</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>PCIe link power off (ASPM)</Text>
                    <Name>desktop-device-power</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>NVMe idle timeout up</Text>
                    <Name>nvme-latency</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage DependsOn="pc-laptop" Description="Laptop-only settings - battery safe.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>GGOS Laptop power plan</Text>
                    <Name>laptop-power</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Wi-Fi latency fix</Text>
                    <Name>wifi-tuning</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>NVMe idle timeout up (AC)</Text>
                    <Name>nvme-latency</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage Description="Mouse and keyboard - wired and wireless.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Disable mouse acceleration</Text>
                    <Name>input-accel</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Lower input buffer latency</Text>
                    <Name>input-queue</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Wireless dongle stutter fix</Text>
                    <Name>wireless-input</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage Description="Network tuning - wired adapters only.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Lower ping (TCP)</Text>
                    <Name>network-latency</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Bufferbloat relief</Text>
                    <Name>network-bufferbloat</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>NIC low-latency (EEE off)</Text>
                    <Name>network-nic</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Ultra NIC mode (uses CPU)</Text>
                    <Name>network-ultra</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
    </FeaturePages>
</Playbook>
