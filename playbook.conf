<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>GGOS</Name>
    <Username>Pratik</Username>
    <ShortDescription>Interactive Windows optimization, debloat and cleanup playbook</ShortDescription>
    <Title>GGOS - Windows Performance Playbook</Title>
    <Description>GGOS applies a curated set of system and per-user performance, privacy, debloat and cleanup tweaks, with per-item selection before anything runs. A restore point and registry export are created automatically before any change is applied.</Description>
    <Details>GGOS performance playbook. Registry, services, scheduled tasks, APPX, power and cleanup optimizations with interactive feature selection and rollback protection.</Details>
    <Version>0.1.0</Version>
    <UniqueId>7c1f2b3e-5d84-4a91-b2c6-0e9f8a7d4c31</UniqueId>
    <Requirements>
        <Requirement>NoPendingUpdates</Requirement>
        <Requirement>PluggedIn</Requirement>
    </Requirements>
    <FeaturePages>
        <CheckboxPage Description="Select which optimization areas GGOS should apply.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>System performance tweaks</Text>
                    <Name>system-optimization</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Service tuning (safe subset)</Text>
                    <Name>services</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Telemetry and tracking hardening</Text>
                    <Name>telemetry</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Ads and UI clutter removal</Text>
                    <Name>ads-ui</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Per-user tweaks for all profiles</Text>
                    <Name>per-user</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage DependsOn="system-optimization" Description="Optional system areas - these change how Windows behaves.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Legacy F8 boot menu (skipped when BitLocker is on)</Text>
                    <Name>f8-boot</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Verbose logon/logoff messages</Text>
                    <Name>verbose-logon</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Page file auto-configuration</Text>
                    <Name>pagefile</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage Description="Select bloatware to remove. Removed apps may reinstall after major updates.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Copilot (consumer)</Text>
                    <Name>bloat-copilot</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Bing Search app</Text>
                    <Name>bloat-bing</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Widgets and Web Experience</Text>
                    <Name>bloat-widgets</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Disable Office telemetry tasks</Text>
                    <Name>office-telemetry</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage Description="Gaming optimizations - desktop and laptop aware.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Apply gaming tweaks (HAGS, MMCS, power plan)</Text>
                    <Name>gaming</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage Description="Cleanup and software - aggressive items are opt-in.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Run safe cleanup (temp, caches, logs)</Text>
                    <Name>cleanup</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Aggressive cleanup (update cache, component store)</Text>
                    <Name>cleanup-aggressive</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Update all apps via WinGet</Text>
                    <Name>winget-update</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
    </FeaturePages>
</Playbook>
