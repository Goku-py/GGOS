<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>GGOS</Name>
    <Username>Goku</Username>
    <ShortDescription>Interactive Windows optimization, debloat and cleanup playbook</ShortDescription>
    <Title>GGOS - Windows Performance Playbook</Title>
    <Description>GGOS makes Windows faster, cleaner and more private. You choose exactly what to apply from the list on the next screens - every checkbox explains itself, and hardware is detected so desktops and laptops each get settings that fit them. Before anything changes, GGOS creates and verifies a System Restore point (or backs up the registry if one cannot be made), so system changes can be undone. App removals, disk cleanup and app updates are not reversible. Nothing here disables Windows security, Windows Update, or your antivirus. Tick the defaults, or adjust freely - each item is independent.</Description>
    <Details>GGOS performance playbook. Registry, services, scheduled tasks, APPX, power and cleanup optimizations with interactive feature selection, rollback protection and hardware-aware policies.</Details>
    <Version>0.4.0</Version>
    <UniqueId>7c1f2b3e-5d84-4a91-b2c6-0e9f8a7d4c31</UniqueId>
    <!-- Update source: AME polls this repository's releases. The release tag must
         equal <Version> and contain exactly one .apbx asset. -->
    <Git>https://github.com/Goku-py/GGOS</Git>
    <Requirements>
        <Requirement>NoPendingUpdates</Requirement>
        <Requirement>PluggedIn</Requirement>
    </Requirements>
    <!-- Windows 11 22H2 (22621) through 26H2 (26300). The Wizard refuses to run
         the playbook on unlisted builds (GUI-enforced; the CLI does not check).
         Build-specific values remain guarded by action-level builds: conditions
         inside the task files. -->
    <SupportedBuilds>
        <string>22621</string>
        <string>22631</string>
        <string>26100</string>
        <string>26200</string>
        <string>26300</string>
    </SupportedBuilds>
    <FeaturePages>
        <RadioPage DefaultOption="pc-auto" Description="Which PC is this? Auto-detect works for most machines.">
            <Options>
                <RadioOption>
                    <Text>Auto-detect (recommended)</Text>
                    <Name>pc-auto</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Desktop</Text>
                    <Name>pc-desktop</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Laptop</Text>
                    <Name>pc-laptop</Name>
                </RadioOption>
            </Options>
        </RadioPage>
        <CheckboxPage Description="Recommended core defaults. A restore point is created before any change.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Core system tweaks</Text>
                    <Name>system-optimization</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Service tuning</Text>
                    <Name>services</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Telemetry hardening</Text>
                    <Name>telemetry</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove ads and clutter</Text>
                    <Name>ads-ui</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage DependsOn="system-optimization" Description="Per-user profile tweaks and optional system changes like F8 and page file.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Apply to all user profiles</Text>
                    <Name>per-user</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Detailed logon messages</Text>
                    <Name>verbose-logon</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Restore F8 boot menu</Text>
                    <Name>f8-boot</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Auto-tune page file</Text>
                    <Name>pagefile</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage Description="Pick the bundled apps and ads features you want removed from Windows.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Copilot</Text>
                    <Name>bloat-copilot</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Bing Search</Text>
                    <Name>bloat-bing</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Widgets</Text>
                    <Name>bloat-widgets</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Remove OEM trial apps</Text>
                    <Name>bloat-oem</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage Description="Disable Office telemetry and enable PC gaming mode optimizations.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Disable Office telemetry</Text>
                    <Name>office-telemetry</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Gaming mode</Text>
                    <Name>gaming</Name>
                </CheckboxOption>
            </Options>
            <BottomLine Text="Auto-detects desktop or laptop."/>
        </CheckboxPage>
        <CheckboxPage Description="Opt-in disk cleanup and updating all installed apps with winget.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Safe disk cleanup</Text>
                    <Name>cleanup</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Deep cleanup (cannot be undone)</Text>
                    <Name>cleanup-aggressive</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Update all apps</Text>
                    <Name>winget-update</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage Description="CPU and device power tuning for desktops - skipped automatically on laptops.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>CPU max performance (EPP)</Text>
                    <Name>epp-perf</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>PCIe link power off (ASPM)</Text>
                    <Name>desktop-device-power</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>NVMe idle timeout up</Text>
                    <Name>nvme-latency</Name>
                </CheckboxOption>
            </Options>
            <BottomLine Text="Desktop-only values are not applied to laptops."/>
        </CheckboxPage>
        <CheckboxPage Description="Laptop power plan and Wi-Fi tuning with battery-safe AC/DC handling.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>GGOS Laptop power plan</Text>
                    <Name>laptop-power</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Wi-Fi latency fix</Text>
                    <Name>wifi-tuning</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>NVMe idle timeout up (AC)</Text>
                    <Name>nvme-latency-laptop</Name>
                </CheckboxOption>
            </Options>
            <BottomLine Text="Battery (DC) values change only through the GGOS Laptop plan."/>
        </CheckboxPage>
        <CheckboxPage Description="Mouse and keyboard latency tweaks for wired and wireless devices.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Disable mouse acceleration</Text>
                    <Name>input-accel</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Lower input buffer latency</Text>
                    <Name>input-queue</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Wireless dongle stutter fix</Text>
                    <Name>wireless-input</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage Description="Wired network latency tuning - TCP, bufferbloat and NIC low-latency.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Lower ping (TCP)</Text>
                    <Name>network-latency</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Bufferbloat relief</Text>
                    <Name>network-bufferbloat</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>NIC low-latency (EEE off)</Text>
                    <Name>network-nic</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Ultra NIC mode (uses CPU)</Text>
                    <Name>network-ultra</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
    </FeaturePages>
</Playbook>
