<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>GGOS</Name>
    <Username>Goku</Username>
    <ShortDescription>Windows performance, privacy and debloat playbook with optional extras</ShortDescription>
    <Title>GGOS - Windows Performance Playbook</Title>
    <Description>GGOS makes Windows faster, cleaner and more private, and it does the tuning itself. It hardens telemetry and ads, tunes services and scheduled tasks, removes Copilot, Bing search and Widgets, applies hardware-aware power, input and network latency settings, cleans GPU shader caches and writes a read-only security report. Desktops and laptops are treated differently according to detected hardware. Before anything changes, GGOS creates and verifies a System Restore point, or backs up the registry if one cannot be made. The checkboxes on the next screens are optional extras only - per-account scope, extra app and OneDrive removal, wallpaper, the Toolkit, one-time cleanup and updates, and app installs. Nothing here disables Windows security, Windows Update or your antivirus. App removals, disk cleanup, updates and installs are not reversible.</Description>
    <Details>GGOS performance playbook. Automatic registry, services, scheduled-task, APPX, power, input and network tuning with a small set of opt-in extras, rollback protection and hardware-aware policies.</Details>
    <Version>0.6.0</Version>
    <UniqueId>7c1f2b3e-5d84-4a91-b2c6-0e9f8a7d4c31</UniqueId>
    <!-- Update source: AME polls this repository's releases. The release tag must
         equal <Version> and contain exactly one .apbx asset. -->
    <Git>https://github.com/Goku-py/GGOS</Git>
    <Requirements>
        <Requirement>NoPendingUpdates</Requirement>
        <Requirement>PluggedIn</Requirement>
    </Requirements>
    <!-- Windows 11 22H2 (22621) through 26H2 (26300). The Wizard refuses to run
         the playbook on unlisted builds (GUI-enforced; the CLI does not check).
         Build-specific values remain guarded by action-level builds: conditions
         inside the task files. -->
    <SupportedBuilds>
        <string>22621</string>
        <string>22631</string>
        <string>26100</string>
        <string>26200</string>
        <string>26300</string>
    </SupportedBuilds>
    <FeaturePages>
        <RadioPage DefaultOption="pc-auto" Description="Which PC is this? Auto-detect works for most machines.">
            <Options>
                <RadioOption>
                    <Text>Auto-detect (recommended)</Text>
                    <Name>pc-auto</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Desktop</Text>
                    <Name>pc-desktop</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Laptop</Text>
                    <Name>pc-laptop</Name>
                </RadioOption>
            </Options>
        </RadioPage>
        <CheckboxPage Description="Optional extras only. GGOS tunes Windows either way - nothing here is required.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Apply tweaks to all user accounts</Text>
                    <Name>per-user</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Remove extra preinstalled and OEM apps</Text>
                    <Name>bloat-extra</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Uninstall OneDrive</Text>
                    <Name>onedrive-remove</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Install GGOS Toolkit and shortcut</Text>
                    <Name>toolkit-install</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Apply GGOS wallpaper</Text>
                    <Name>ggos-theme</Name>
                </CheckboxOption>
            </Options>
            <BottomLine Text="Extras include OEM trials (HP/Dell/Lenovo/McAfee) plus Teams, Clipchamp and Outlook. Unticking all-user accounts also skips the Office telemetry block."/>
        </CheckboxPage>
        <CheckboxPage Description="Once-only cleanup and updates. These change files and apps, not settings.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Safe disk cleanup</Text>
                    <Name>cleanup</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Deep cleanup (cannot be undone)</Text>
                    <Name>cleanup-aggressive</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Update all apps</Text>
                    <Name>winget-update</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage Description="Install a browser and utility starter set with winget as the current user.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Install Firefox</Text>
                    <Name>app-firefox</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Install Brave browser</Text>
                    <Name>app-brave</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Install 7-Zip</Text>
                    <Name>app-7zip</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Install PowerToys</Text>
                    <Name>app-powertoys</Name>
                </CheckboxOption>
            </Options>
            <BottomLine Text="These checkboxes install software on this PC - nothing is removed here."/>
        </CheckboxPage>
    </FeaturePages>
</Playbook>
