<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>GGOS</Name>
    <Username>Goku</Username>
    <ShortDescription>Interactive Windows optimization, debloat and cleanup playbook</ShortDescription>
    <Title>GGOS - Windows Performance Playbook</Title>
    <Description>GGOS applies a curated set of system and per-user performance, privacy, debloat and cleanup tweaks, with per-item selection before anything runs. A restore point and registry export are created automatically before any change is applied, and desktop vs. laptop hardware is detected so each device gets the settings that fit it.</Description>
    <Details>GGOS performance playbook. Registry, services, scheduled tasks, APPX, power and cleanup optimizations with interactive feature selection, rollback protection and hardware-aware policies.</Details>
    <Version>0.2.1</Version>
    <UniqueId>7c1f2b3e-5d84-4a91-b2c6-0e9f8a7d4c31</UniqueId>
    <Requirements>
        <Requirement>NoPendingUpdates</Requirement>
        <Requirement>PluggedIn</Requirement>
    </Requirements>
    <FeaturePages>
        <CheckboxPage Description="A restore point is created first. Defaults are the recommended set; services stay available on demand and security/update services are never touched. Select which optimization areas GGOS should apply.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Core system tweaks - responsiveness, long paths, search, network stack</Text>
                    <Name>system-optimization</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Service tuning - move ~140 non-critical services to manual start</Text>
                    <Name>services</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Telemetry hardening - diagnostics, feedback, ad ID, Recall off</Text>
                    <Name>telemetry</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Ads and clutter - lock screen, Start menu, Explorer, suggestions off</Text>
                    <Name>ads-ui</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage DependsOn="system-optimization" Description="Per-user tweaks and optional system behaviors.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Apply privacy/UI tweaks to every user profile, present and future</Text>
                    <Name>per-user</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Show detailed logon/logoff status messages instead of the spinner</Text>
                    <Name>verbose-logon</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Restore the F8 boot menu (auto-skipped when BitLocker is on)</Text>
                    <Name>f8-boot</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Auto-size the page file to your RAM tier (skipped at 32 GB+)</Text>
                    <Name>pagefile</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage Description="Select bloatware to remove. Removal covers installed and provisioned packages with reinstall prevention; removed store apps may reinstall after major feature updates.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Remove consumer Copilot app and block reinstall (M365 unaffected)</Text>
                    <Name>bloat-copilot</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove the Bing Search app - keep Start-menu search local</Text>
                    <Name>bloat-bing</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Remove Widgets and Web Experience - kills background web processes</Text>
                    <Name>bloat-widgets</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Remove OEM trial bloat - HP, Dell, Lenovo, McAfee, WildTangent</Text>
                    <Name>bloat-oem</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage Description="Office telemetry and gaming optimizations.">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>Disable Office telemetry agents, CEIP and feedback tasks</Text>
                    <Name>office-telemetry</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Gaming mode - HAGS, 0.5 ms timer, MMCS, chassis-aware power plan</Text>
                    <Name>gaming</Name>
                </CheckboxOption>
            </Options>
            <BottomLine Text="Gaming mode detects desktop vs. laptop and applies the matching power policy."/>
        </CheckboxPage>
        <CheckboxPage Description="Safe cleanup only removes recoverable space; the Recycle Bin and Office autorecover data are never touched. Aggressive cleanup cannot be undone - only tick it if free space matters more than update rollback.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Safe cleanup - temp files, app caches, logs (recoverable space)</Text>
                    <Name>cleanup</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Aggressive cleanup - update cache, old installs (cannot be undone)</Text>
                    <Name>cleanup-aggressive</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Update all WinGet apps silently (some packages may force a reboot)</Text>
                    <Name>winget-update</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage Description="Advanced options - leave defaults unless you know you need them.">
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>TCP latency tuning - Nagle off per wired adapter for lower game ping</Text>
                    <Name>network-latency</Name>
                </CheckboxOption>
            </Options>
            <BottomLine Text="Original per-adapter values are recorded so the change can be undone."/>
        </CheckboxPage>
    </FeaturePages>
</Playbook>
